# SPDX-License-Identifier: MPL-2.0
name: Windows diagnostics

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'global.json', 'scripts/package_diagnostics.py', 'docs/DIAGNOSTICS.md', '.github/ISSUE_TEMPLATE/**', '.github/workflows/diagnostics.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'global.json', 'scripts/package_diagnostics.py', 'docs/DIAGNOSTICS.md', '.github/ISSUE_TEMPLATE/**', '.github/workflows/diagnostics.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Verify report content and privacy filters
        run: dotnet run --project tests/Grelecy.Diagnostics.Tests --configuration Release

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the graphical workflow and local Windows collection
        run: dotnet run --project tests/Grelecy.Diagnostics.Windows.SmokeTests --configuration Release -- --live-collector --screenshots artifacts/ui-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-UI-smoke-screenshots
          path: artifacts/ui-smoke/*.png
          if-no-files-found: ignore
      - name: Package the portable Windows application
        run: python scripts/package_diagnostics.py
      - name: Open and close the packaged Windows executable
        shell: pwsh
        run: |
          $programPath = (Resolve-Path artifacts/publish/win-x64/GRELECY-Diagnostics.exe).Path
          $program = [System.Diagnostics.Process]::new()
          $program.StartInfo = [System.Diagnostics.ProcessStartInfo]::new($programPath)
          $program.StartInfo.UseShellExecute = $false
          $phase = 'launch'
          function Fail-ApplicationCheck([string]$message) {
            Write-Host "::error title=Packaged Windows application::$message"
            throw $message
          }
          try {
            if (-not $program.Start()) { Fail-ApplicationCheck 'The packaged process could not be started.' }
            $phase = 'window'
            $startup = [System.Diagnostics.Stopwatch]::StartNew()
            do {
              $program.Refresh()
              if ($program.HasExited) { Fail-ApplicationCheck "The packaged application exited before opening its window (code $($program.ExitCode))." }
              if ($program.MainWindowHandle -ne 0) { break }
              Start-Sleep -Milliseconds 100
            } while ($startup.Elapsed.TotalSeconds -lt 30)
            if ($program.MainWindowHandle -eq 0) { Fail-ApplicationCheck 'The packaged application did not open a window within 30 seconds.' }
            $phase = 'ready'
            if (-not $program.WaitForInputIdle(10000)) { Fail-ApplicationCheck 'The packaged window did not become ready.' }
            $phase = 'close'
            if (-not $program.CloseMainWindow()) { Fail-ApplicationCheck 'The packaged window could not be closed normally.' }
            if (-not $program.WaitForExit(5000)) { Fail-ApplicationCheck 'The packaged application did not exit after closing its window.' }
            if ($program.ExitCode -ne 0) { Fail-ApplicationCheck "The packaged application exited with code $($program.ExitCode)." }
          } catch {
            Write-Host "::error title=Packaged Windows application::$phase failed ($($_.Exception.GetType().Name))."
            throw
          } finally {
            if ($program.Id -and -not $program.HasExited) { $program.Kill() }
            $program.Dispose()
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GRELECY-Diagnostics-win-x64
          path: |
            artifacts/GRELECY-Diagnostics-*-win-x64.zip
            artifacts/GRELECY-Diagnostics-*-win-x64.zip.sha256
          if-no-files-found: error
